<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #0f1028 30%, #151535 60%, #1a1040 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        /* Animated background orbs */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.12;
            z-index: -1;
            pointer-events: none;
            will-change: transform;
            animation: floatOrb 20s ease-in-out infinite alternate;
        }
        body::before {
            width: 400px; height: 400px;
            background: #3a5fd5;
            top: -120px; left: -120px;
        }
        body::after {
            width: 350px; height: 350px;
            background: #d4a853;
            bottom: -80px; right: -100px;
            animation-delay: -8s;
            animation-duration: 24s;
        }
        @keyframes floatOrb {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(50px, -40px) scale(1.15); }
            100% { transform: translate(-30px, 30px) scale(0.9); }
        }

        /* Third floating orb via extra element */
        .orb-extra {
            position: fixed;
            width: 280px; height: 280px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.08;
            z-index: -1;
            pointer-events: none;
            will-change: transform;
            background: #5c6ce7;
            top: 50%; left: 60%;
            animation: floatOrb 25s ease-in-out infinite alternate-reverse;
        }

        /* Animated gradient border wrapper */
        .container-border {
            position: relative;
            padding: 2px;
            border-radius: 22px;
            background: linear-gradient(var(--border-angle, 135deg),
                #3a7bd5, #6c5ce7, #e17055, #d4a853, #3a7bd5);
            background-size: 300% 300%;
            animation: rotateBorder 8s ease infinite;
        }
        @keyframes rotateBorder {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 28px 24px 20px;
            background: rgba(12, 12, 30, 0.85);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow:
                0 20px 60px rgba(0,0,0,0.6),
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 0 100px -30px rgba(58,123,213,0.1);
            animation: containerIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes containerIn {
            from { opacity: 0; transform: translateY(24px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.85rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(58,123,213,0.35), 0 2px 10px rgba(0,0,0,0.4);
            background: linear-gradient(135deg, #ffffff 0%, #a8c8ff 30%, #d4a853 60%, #ffffff 100%);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 5s linear infinite;
            position: relative;
        }
        h1::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(212,168,83,0.5), transparent);
            border-radius: 2px;
        }
        @keyframes shimmer {
            0%   { background-position: -300% center; }
            100% { background-position: 300% center; }
        }

        /* Staggered entrance animations */
        #game-container > * {
            animation: fadeSlideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        #game-container > *:nth-child(1) { animation-delay: 0.1s; }
        #game-container > *:nth-child(2) { animation-delay: 0.2s; }
        #game-container > *:nth-child(3) { animation-delay: 0.3s; }
        #game-container > *:nth-child(4) { animation-delay: 0.35s; }
        #game-container > *:nth-child(5) { animation-delay: 0.4s; }
        #game-container > *:nth-child(6) { animation-delay: 0.45s; }
        #game-container > *:nth-child(7) { animation-delay: 0.5s; }
        #game-container > *:nth-child(8) { animation-delay: 0.55s; }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* --- Mode Switch Tabs --- */
        #mode-switch {
            display: flex;
            gap: 0;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid rgba(255,255,255,0.06);
            position: relative;
        }
        #mode-switch button {
            padding: 10px 26px;
            border: none;
            border-radius: 9px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            background: transparent;
            color: #6a6a90;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            letter-spacing: 0.4px;
            position: relative;
            z-index: 1;
        }
        #mode-switch button:hover {
            color: #b0b0d0;
            background: rgba(255,255,255,0.04);
        }
        #mode-switch button.active {
            background: linear-gradient(135deg, #3a7bd5 0%, #6c5ce7 100%);
            color: #fff;
            box-shadow: 0 4px 20px rgba(58,123,213,0.45), 0 0 30px rgba(108,92,231,0.15);
            transform: scale(1.03);
            text-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        /* --- Controls (Spielen) --- */
        #controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* --- Shared Selects & Buttons --- */
        select, .ctrl-btn {
            padding: 9px 16px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            background: rgba(255,255,255,0.04);
            color: #d0d0e8;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            /* lightweight - no backdrop-filter */
        }
        select:hover, .ctrl-btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.18);
        }
        select:focus {
            border-color: rgba(58,123,213,0.5);
            box-shadow: 0 0 0 3px rgba(58,123,213,0.12), 0 0 20px rgba(58,123,213,0.08);
        }
        select option {
            background: #12122a;
            color: #d0d0e8;
        }
        .ctrl-btn {
            background: linear-gradient(135deg, rgba(58,123,213,0.15), rgba(108,92,231,0.15));
            border-color: rgba(58,123,213,0.2);
            color: #c0d0ff;
            position: relative;
            overflow: hidden;
        }
        .ctrl-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.05));
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .ctrl-btn:hover::before {
            opacity: 1;
        }
        .ctrl-btn:hover {
            background: linear-gradient(135deg, rgba(58,123,213,0.3), rgba(108,92,231,0.3));
            border-color: rgba(58,123,213,0.4);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(58,123,213,0.25), 0 0 30px rgba(108,92,231,0.08);
        }
        .ctrl-btn:active {
            transform: translateY(0) scale(0.98);
        }
        .btn-accent {
            background: linear-gradient(135deg, #3a7bd5, #6c5ce7);
            border-color: transparent;
            color: #fff;
            position: relative;
            overflow: hidden;
            font-weight: 600;
        }
        .btn-accent::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .btn-accent:hover::after {
            opacity: 1;
        }
        .btn-accent:hover {
            background: linear-gradient(135deg, #4a8be5, #7c6cf7);
            color: #fff;
            box-shadow: 0 6px 24px rgba(58,123,213,0.5), 0 0 40px rgba(108,92,231,0.2);
            transform: translateY(-2px);
        }
        /* Pulse animation for primary action buttons */
        .btn-accent {
            animation: btnPulseGlow 3s ease-in-out infinite;
        }
        @keyframes btnPulseGlow {
            0%, 100% { box-shadow: 0 2px 12px rgba(58,123,213,0.25); }
            50%      { box-shadow: 0 2px 20px rgba(58,123,213,0.4), 0 0 30px rgba(108,92,231,0.12); }
        }

        /* --- Status Bar --- */
        #status {
            font-size: 0.95rem;
            font-weight: 500;
            padding: 10px 28px;
            background: linear-gradient(135deg, rgba(58,123,213,0.06), rgba(108,92,231,0.04));
            border: 1px solid rgba(58,123,213,0.1);
            border-radius: 12px;
            min-width: 340px;
            text-align: center;
            letter-spacing: 0.3px;
            color: #c8c8e8;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }
        #status::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
            animation: statusShine 4s ease-in-out infinite;
        }
        @keyframes statusShine {
            0%, 100% { left: -100%; }
            50%      { left: 100%; }
        }

        /* --- Training Controls --- */
        #training-controls {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        #training-controls .row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        #puzzle-title {
            font-size: 0.92rem;
            font-weight: 600;
            color: #d4a853;
            letter-spacing: 0.3px;
            text-shadow: 0 0 16px rgba(212,168,83,0.3);
        }
        #puzzle-hint {
            font-size: 0.88rem;
            color: #7fc97f;
            min-height: 1.2em;
            cursor: pointer;
            font-weight: 500;
            text-shadow: 0 0 10px rgba(127,201,127,0.15);
        }
        #puzzle-progress {
            font-size: 0.82rem;
            color: #6a6a8f;
            font-weight: 500;
        }

        /* --- Friend Setup Panel --- */
        #friend-setup {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            padding: 24px 28px;
            width: 100%;
            max-width: 420px;
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        #friend-setup .setup-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #fff, #d4a853);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #friend-setup .setup-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }
        #friend-setup .setup-group-label {
            font-size: 0.76rem;
            font-weight: 600;
            color: #7a7a9f;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        #friend-setup select {
            width: 100%;
        }
        #friend-setup .setup-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        #friend-setup .setup-row select {
            flex: 1;
        }
        #btn-start-friend {
            margin-top: 8px;
            padding: 14px 44px;
            font-size: 1.02rem;
            font-weight: 600;
            letter-spacing: 1.2px;
            border-radius: 12px;
        }
        #friend-ingame {
            display: none;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }

        /* --- Settings Row --- */
        #settings-row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        #settings-row label {
            font-size: 0.82rem;
            color: #7a7a9f;
            font-weight: 500;
        }
        #settings-row select {
            padding: 6px 12px;
            font-size: 0.82rem;
        }

        /* --- Phaser Canvas --- */
        #phaser-game {
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow:
                0 12px 40px rgba(0,0,0,0.5),
                0 0 80px -15px rgba(58,123,213,0.12),
                inset 0 0 0 1px rgba(255,255,255,0.06);
            transition: box-shadow 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #phaser-game:hover {
            box-shadow:
                0 16px 50px rgba(0,0,0,0.6),
                0 0 100px -15px rgba(58,123,213,0.2),
                0 0 40px -10px rgba(108,92,231,0.1),
                inset 0 0 0 1px rgba(255,255,255,0.1);
            transform: translateY(-2px);
        }
        #phaser-game canvas {
            border-radius: 16px;
        }

        /* --- Footer --- */
        #footer-credit {
            font-size: 0.72rem;
            color: rgba(255,255,255,0.15);
            letter-spacing: 1.5px;
            font-weight: 400;
            margin-top: 6px;
            transition: color 0.3s ease;
        }
        #footer-credit:hover {
            color: rgba(212,168,83,0.4);
        }

        /* --- Particles Background --- */
        #particles-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* --- Floating chess pieces background --- */
        #chess-float-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .chess-float-piece {
            position: absolute;
            font-size: 2rem;
            opacity: 0.04;
            will-change: transform;
            animation: floatPiece linear infinite;
            color: #c0c0ff;
        }
        @keyframes floatPiece {
            0%   { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-120px) rotate(360deg); }
        }

        /* --- Scrollbar --- */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

        /* --- Selection Color --- */
        ::selection {
            background: rgba(58,123,213,0.3);
            color: #fff;
        }

        /* --- Touch & iPad Optimierungen --- */
        html, body {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        #phaser-game {
            touch-action: none;
            max-width: 100%;
            width: min(100%, 680px);
        }
        #phaser-game canvas {
            max-width: 100%;
            display: block;
        }

        /* iPad Landscape (begrenzte Höhe) */
        @media (max-height: 860px) {
            #game-container {
                padding: 14px 18px 12px;
                gap: 8px;
            }
            h1 { font-size: 1.35rem; }
            #status {
                padding: 6px 18px;
                font-size: 0.85rem;
                min-width: 280px;
            }
            #mode-switch button {
                padding: 7px 18px;
                font-size: 0.85rem;
            }
            select, .ctrl-btn {
                padding: 7px 14px;
                font-size: 0.82rem;
            }
            #settings-row select {
                padding: 5px 10px;
            }
            #puzzle-title { font-size: 0.85rem; }
        }

        /* Tablet (iPad etc.) */
        @media (max-width: 1100px) and (pointer: coarse) {
            body { padding: 12px 0; }
            #game-container {
                padding: 14px 10px 10px;
                gap: 8px;
                border-radius: 14px;
                width: 92vw;
                max-width: 600px;
            }
            h1 { font-size: 1.3rem; }
            #status { min-width: auto; width: 100%; font-size: 0.85rem; }
            #controls, #training-controls .row, #settings-row {
                width: 100%;
            }
            #phaser-game {
                width: 100% !important;
                max-width: 100% !important;
            }
            #phaser-game canvas {
                width: 100% !important;
                height: auto !important;
                max-width: 100% !important;
            }
        }
        /* Schmales Tablet Portrait */
        @media (max-width: 820px) {
            #game-container {
                width: 95vw;
                max-width: 560px;
            }
        }

        /* Sehr begrenzter Platz (Landscape kleines iPad) */
        @media (max-height: 750px) {
            #game-container {
                padding: 8px 12px;
                gap: 6px;
            }
            h1 { font-size: 1.2rem; }
            #mode-switch button {
                padding: 6px 14px;
                font-size: 0.8rem;
            }
            #status {
                padding: 5px 14px;
                font-size: 0.8rem;
            }
            select, .ctrl-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
        }

        /* Touch target Mindestgröße */
        @media (pointer: coarse) {
            select, .ctrl-btn, #mode-switch button {
                min-height: 44px;
            }
            #controls { gap: 8px; }
            #training-controls .row { gap: 8px; }
        }

        /* Tablet: Hide border animation (performance) */
        @media (max-width: 1100px) and (pointer: coarse) {
            .container-border {
                background: rgba(58,123,213,0.15);
            }
        }
    </style>
</head>
<body>
    <div class="orb-extra"></div>
    <div id="chess-float-bg"></div>
    <div class="container-border">
    <div id="game-container">
        <h1>&#9816; Schach</h1>
        <div id="mode-switch">
            <button id="btn-mode-play" class="active">&#9876; Spielen</button>
            <button id="btn-mode-friend">&#9822; Gegen Freund</button>
            <button id="btn-mode-train">&#128218; Training</button>
        </div>
        <div id="controls">
            <select id="play-as" title="Spielfarbe">
                <option value="white">Spielen als Weiß</option>
                <option value="black">Spielen als Schwarz</option>
            </select>
            <select id="difficulty" title="Schwierigkeit">
                <option value="1">Anfänger</option>
                <option value="2" selected>Mittel</option>
                <option value="3">Stark</option>
            </select>
            <button id="btn-new-game" class="ctrl-btn btn-accent">Neues Spiel</button>
        </div>
        <div id="friend-setup">
            <div class="setup-title">♞ Gegen Freund</div>
            <div class="setup-group">
                <span class="setup-group-label">Variante</span>
                <select id="friend-variant" title="Variante">
                    <option value="standard">♚ Standard</option>
                    <option value="chess960">🎲 Chess960</option>
                    <option value="antichess">⚔️ Räuberschach</option>
                </select>
            </div>
            <div class="setup-group">
                <span class="setup-group-label">Handicap</span>
                <div class="setup-row">
                    <select id="friend-handicap-white" title="Handicap Weiß">
                        <option value="none">♔ Weiß: Alle Figuren</option>
                        <option value="queen">Weiß: Ohne Dame</option>
                        <option value="rook">Weiß: Ohne Türme</option>
                        <option value="bishop">Weiß: Ohne Läufer</option>
                        <option value="knight">Weiß: Ohne Springer</option>
                        <option value="rook-knight">Weiß: Ohne Turm+Springer</option>
                    </select>
                    <select id="friend-handicap-black" title="Handicap Schwarz">
                        <option value="none">♚ Schwarz: Alle Figuren</option>
                        <option value="queen">Schwarz: Ohne Dame</option>
                        <option value="rook">Schwarz: Ohne Türme</option>
                        <option value="bishop">Schwarz: Ohne Läufer</option>
                        <option value="knight">Schwarz: Ohne Springer</option>
                        <option value="rook-knight">Schwarz: Ohne Turm+Springer</option>
                    </select>
                </div>
            </div>
            <button id="btn-start-friend" class="ctrl-btn btn-accent">▶ Spiel starten</button>
        </div>
        <div id="friend-ingame">
            <button id="btn-new-friend-game" class="ctrl-btn">Neue Einstellungen</button>
            <button id="btn-restart-friend" class="ctrl-btn btn-accent">↻ Neustart</button>
        </div>
        <div id="training-controls">
            <div class="row">
                <select id="puzzle-category"></select>
                <button id="btn-reset-puzzle" class="ctrl-btn">↻ Neustart</button>
                <button id="btn-next-puzzle" class="ctrl-btn btn-accent">Nächstes →</button>
            </div>
            <div class="row">
                <button id="btn-hint" class="ctrl-btn">💡 Hinweis</button>
                <button id="btn-prev-puzzle" style="display:none;"></button>
            </div>
            <div id="puzzle-title"></div>
            <div id="puzzle-hint"></div>
            <div id="puzzle-progress"></div>
        </div>
        <div id="settings-row">
            <label for="piece-style">Figuren:</label>
            <select id="piece-style" title="Figurenstil">
                <option value="wood">Holz</option>
                <option value="cburnett" selected>Cburnett</option>
                <option value="merida">Merida</option>
                <option value="alpha">Alpha</option>
                <option value="staunty">Staunty</option>

    <script>
    // Floating chess pieces background
    (function() {
        const container = document.getElementById('chess-float-bg');
        if (!container) return;
        const pieces = ['♔','♕','♖','♗','♘','♙','♚','♛','♜','♝','♞','♟'];
        for (let i = 0; i < 6; i++) {
            const el = document.createElement('span');
            el.className = 'chess-float-piece';
            el.textContent = pieces[i * 2 % pieces.length];
            el.style.left = (Math.random() * 100) + '%';
            el.style.fontSize = (Math.random() * 1.2 + 1.2) + 'rem';
            el.style.animationDuration = (Math.random() * 20 + 30) + 's';
            el.style.animationDelay = (Math.random() * 25) + 's';
            el.style.opacity = (Math.random() * 0.03 + 0.02);
            container.appendChild(el);
        }
    })();

    // Enhanced particles with connections
    (function() {
        const c = document.getElementById('particles-bg');
        if (!c) return;
        const ctx = c.getContext('2d');
        let w, h, particles = [];
        function resize() { w = c.width = window.innerWidth; h = c.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();
        for (let i = 0; i < 25; i++) {
            particles.push({
                x: Math.random() * w, y: Math.random() * h,
                r: Math.random() * 1.8 + 0.4,
                dx: (Math.random() - 0.5) * 0.2,
                dy: (Math.random() - 0.5) * 0.2,
                o: Math.random() * 0.18 + 0.04,
            });
        }
        let frame = 0;
        function draw() {
            frame++;
            // Only draw every other frame for performance
            if (frame % 2 === 0) {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => {
                    p.x += p.dx; p.y += p.dy;
                    if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
                    if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(140,170,255,' + p.o + ')';
                    ctx.fill();
                });
            }
            requestAnimationFrame(draw);
        }
        draw();
    })();
    </script>
