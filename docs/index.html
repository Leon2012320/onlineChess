<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0f0c29 0%, #1a1a3e 40%, #24243e 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        /* Animated background orbs */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.12;
            z-index: -1;
            pointer-events: none;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }
        body::before {
            width: 420px; height: 420px;
            background: radial-gradient(circle, #3a7bd5, #5b68d4);
            top: -80px; left: -100px;
        }
        body::after {
            width: 350px; height: 350px;
            background: radial-gradient(circle, #d45b93, #d4a853);
            bottom: -60px; right: -80px;
            animation-delay: -6s;
            animation-duration: 15s;
        }
        @keyframes floatOrb {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(40px, -30px) scale(1.1); }
            100% { transform: translate(-20px, 20px) scale(0.95); }
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 28px 24px 20px;
            background: rgba(16, 16, 40, 0.6);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            backdrop-filter: blur(20px) saturate(1.3);
            box-shadow:
                0 12px 48px rgba(0,0,0,0.5),
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 0 80px -20px rgba(58,123,213,0.08);
            animation: containerIn 0.6s ease-out;
        }
        @keyframes containerIn {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(58,123,213,0.3), 0 2px 8px rgba(0,0,0,0.3);
            background: linear-gradient(135deg, #ffffff 0%, #a8c8ff 50%, #ffffff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s linear infinite;
        }
        @keyframes shimmer {
            0%   { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        /* --- Mode Switch Tabs --- */
        #mode-switch {
            display: flex;
            gap: 0;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            padding: 3px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        #mode-switch button {
            padding: 9px 24px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            background: transparent;
            color: #8a8aaf;
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
        }
        #mode-switch button:hover {
            color: #c0c0e0;
        }
        #mode-switch button.active {
            background: linear-gradient(135deg, #3a7bd5 0%, #5b68d4 100%);
            color: #fff;
            box-shadow: 0 3px 16px rgba(58,123,213,0.4), 0 0 20px rgba(58,123,213,0.15);
            transform: scale(1.02);
        }

        /* --- Controls (Spielen) --- */
        #controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* --- Shared Selects & Buttons --- */
        select, .ctrl-btn {
            padding: 9px 16px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            background: rgba(255,255,255,0.05);
            color: #d0d0e8;
            transition: all 0.2s ease;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        select:hover, .ctrl-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.15);
        }
        select:focus {
            border-color: rgba(58,123,213,0.5);
            box-shadow: 0 0 0 3px rgba(58,123,213,0.15);
        }
        select option {
            background: #1a1a3e;
            color: #d0d0e8;
        }
        .ctrl-btn {
            background: linear-gradient(135deg, rgba(58,123,213,0.2), rgba(91,104,212,0.2));
            border-color: rgba(58,123,213,0.25);
            color: #c0d0ff;
        }
        .ctrl-btn:hover {
            background: linear-gradient(135deg, rgba(58,123,213,0.35), rgba(91,104,212,0.35));
            border-color: rgba(58,123,213,0.4);
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(58,123,213,0.2);
        }
        .ctrl-btn:active {
            transform: translateY(0);
        }
        .btn-accent {
            background: linear-gradient(135deg, #3a7bd5, #5b68d4);
            border-color: transparent;
            color: #fff;
            position: relative;
            overflow: hidden;
        }
        .btn-accent::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .btn-accent:hover::after {
            opacity: 1;
        }
        .btn-accent:hover {
            background: linear-gradient(135deg, #4a8be5, #6b78e4);
            color: #fff;
            box-shadow: 0 4px 18px rgba(58,123,213,0.4), 0 0 30px rgba(58,123,213,0.15);
        }

        /* --- Status Bar --- */
        #status {
            font-size: 0.95rem;
            font-weight: 500;
            padding: 10px 24px;
            background: linear-gradient(135deg, rgba(58,123,213,0.08), rgba(91,104,212,0.06));
            border: 1px solid rgba(58,123,213,0.12);
            border-radius: 10px;
            min-width: 340px;
            text-align: center;
            letter-spacing: 0.2px;
            color: #c8c8e8;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        #status::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
            animation: statusShine 3s ease-in-out infinite;
        }
        @keyframes statusShine {
            0%, 100% { left: -100%; }
            50%      { left: 100%; }
        }

        /* --- Training Controls --- */
        #training-controls {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        #training-controls .row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        #puzzle-title {
            font-size: 0.92rem;
            font-weight: 600;
            color: #d4a853;
            letter-spacing: 0.3px;
            text-shadow: 0 0 12px rgba(212,168,83,0.2);
        }
        #puzzle-hint {
            font-size: 0.88rem;
            color: #7fc97f;
            min-height: 1.2em;
            cursor: pointer;
            font-weight: 500;
        }
        #puzzle-progress {
            font-size: 0.82rem;
            color: #6a6a8f;
            font-weight: 500;
        }

        /* --- Settings Row --- */
        #settings-row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        #settings-row label {
            font-size: 0.82rem;
            color: #8a8aaf;
            font-weight: 500;
        }
        #settings-row select {
            padding: 6px 12px;
            font-size: 0.82rem;
        }

        /* --- Phaser Canvas --- */
        #phaser-game {
            border-radius: 14px;
            overflow: hidden;
            box-shadow:
                0 8px 32px rgba(0,0,0,0.4),
                0 0 60px -10px rgba(58,123,213,0.12),
                inset 0 0 0 1px rgba(255,255,255,0.05);
            transition: box-shadow 0.4s ease;
        }
        #phaser-game:hover {
            box-shadow:
                0 12px 40px rgba(0,0,0,0.5),
                0 0 80px -10px rgba(58,123,213,0.18),
                inset 0 0 0 1px rgba(255,255,255,0.08);
        }
        #phaser-game canvas {
            border-radius: 14px;
        }

        /* --- Footer --- */
        #footer-credit {
            font-size: 0.72rem;
            color: rgba(255,255,255,0.18);
            letter-spacing: 1px;
            font-weight: 400;
            margin-top: 4px;
        }

        /* --- Particles Background --- */
        #particles-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* --- Scrollbar --- */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        /* --- Touch & iPad Optimierungen --- */
        html, body {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        #phaser-game {
            touch-action: none;
            max-width: 100%;
            width: min(100%, 680px);
        }
        #phaser-game canvas {
            max-width: 100%;
            display: block;
        }

        /* iPad Landscape (begrenzte Höhe) */
        @media (max-height: 860px) {
            #game-container {
                padding: 14px 18px 12px;
                gap: 8px;
            }
            h1 { font-size: 1.35rem; }
            #status {
                padding: 6px 18px;
                font-size: 0.85rem;
                min-width: 280px;
            }
            #mode-switch button {
                padding: 7px 18px;
                font-size: 0.85rem;
            }
            select, .ctrl-btn {
                padding: 7px 14px;
                font-size: 0.82rem;
            }
            #settings-row select {
                padding: 5px 10px;
            }
            #puzzle-title { font-size: 0.85rem; }
        }

        /* Tablet (iPad etc.) */
        @media (max-width: 1100px) and (pointer: coarse) {
            body { padding: 12px 0; }
            #game-container {
                padding: 14px 10px 10px;
                gap: 8px;
                border-radius: 14px;
                width: 92vw;
                max-width: 600px;
            }
            h1 { font-size: 1.3rem; }
            #status { min-width: auto; width: 100%; font-size: 0.85rem; }
            #controls, #training-controls .row, #settings-row {
                width: 100%;
            }
            #phaser-game {
                width: 100% !important;
                max-width: 100% !important;
            }
            #phaser-game canvas {
                width: 100% !important;
                height: auto !important;
                max-width: 100% !important;
            }
        }
        /* Schmales Tablet Portrait */
        @media (max-width: 820px) {
            #game-container {
                width: 95vw;
                max-width: 560px;
            }
        }

        /* Sehr begrenzter Platz (Landscape kleines iPad) */
        @media (max-height: 750px) {
            #game-container {
                padding: 8px 12px;
                gap: 6px;
            }
            h1 { font-size: 1.2rem; }
            #mode-switch button {
                padding: 6px 14px;
                font-size: 0.8rem;
            }
            #status {
                padding: 5px 14px;
                font-size: 0.8rem;
            }
            select, .ctrl-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
        }

        /* Touch target Mindestgröße */
        @media (pointer: coarse) {
            select, .ctrl-btn, #mode-switch button {
                min-height: 44px;
            }
            #controls { gap: 8px; }
            #training-controls .row { gap: 8px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>&#9816; Schach</h1>
        <div id="mode-switch">
            <button id="btn-mode-play" class="active">&#9876; Spielen</button>
            <button id="btn-mode-friend">&#9822; Gegen Freund</button>
            <button id="btn-mode-train">&#128218; Training</button>
        </div>
        <div id="controls">
            <select id="play-as" title="Spielfarbe">
                <option value="white">Spielen als Weiß</option>
                <option value="black">Spielen als Schwarz</option>
            </select>
            <select id="difficulty" title="Schwierigkeit">
                <option value="1">Anfänger</option>
                <option value="2" selected>Mittel</option>
                <option value="3">Stark</option>
            </select>
            <button id="btn-new-game" class="ctrl-btn btn-accent">Neues Spiel</button>
        </div>
        <div id="friend-controls" style="display:none;">
            <div class="row" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;">
                <select id="friend-variant" title="Variante">
                    <option value="standard">Standard</option>
                    <option value="chess960">Chess960</option>
                    <option value="antichess">Räuberschach</option>
                </select>
                <button id="btn-new-friend-game" class="ctrl-btn btn-accent">Neues Spiel</button>
            </div>
            <div class="row" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:4px;">
                <select id="friend-handicap-white" title="Handicap Weiß">
                    <option value="none">Weiß: Alle Figuren</option>
                    <option value="queen">Weiß: Ohne Dame</option>
                    <option value="rook">Weiß: Ohne Türme</option>
                    <option value="bishop">Weiß: Ohne Läufer</option>
                    <option value="knight">Weiß: Ohne Springer</option>
                    <option value="rook-knight">Weiß: Ohne Turm+Springer</option>
                </select>
                <select id="friend-handicap-black" title="Handicap Schwarz">
                    <option value="none">Schwarz: Alle Figuren</option>
                    <option value="queen">Schwarz: Ohne Dame</option>
                    <option value="rook">Schwarz: Ohne Türme</option>
                    <option value="bishop">Schwarz: Ohne Läufer</option>
                    <option value="knight">Schwarz: Ohne Springer</option>
                    <option value="rook-knight">Schwarz: Ohne Turm+Springer</option>
                </select>
            </div>
        </div>
        <div id="training-controls">
            <div class="row">
                <select id="puzzle-category"></select>
                <button id="btn-reset-puzzle" class="ctrl-btn">↻ Neustart</button>
                <button id="btn-next-puzzle" class="ctrl-btn btn-accent">Nächstes →</button>
            </div>
            <div class="row">
                <button id="btn-hint" class="ctrl-btn">💡 Hinweis</button>
                <button id="btn-prev-puzzle" style="display:none;"></button>
            </div>
            <div id="puzzle-title"></div>
            <div id="puzzle-hint"></div>
            <div id="puzzle-progress"></div>
        </div>
        <div id="settings-row">
            <label for="piece-style">Figuren:</label>
            <select id="piece-style" title="Figurenstil">
                <option value="wood">Holz</option>
                <option value="cburnett" selected>Cburnett</option>
                <option value="merida">Merida</option>
                <option value="alpha">Alpha</option>
                <option value="staunty">Staunty</option>
                <option value="california">California</option>
                <option value="maestro">Maestro</option>
                <option value="kosal">Kosal</option>
                <option value="letter">Buchstaben</option>
            </select>
        </div>
        <div id="status">Du bist am Zug</div>
        <div id="phaser-game"></div>
        <div id="footer-credit">made with ♟</div>
    </div>
    <canvas id="particles-bg"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/chessLogic.js"></script>
    <script src="js/chessEngine.js"></script>
    <script src="js/puzzleDatabase.js"></script>
    <script src="js/scenes/BootScene.js"></script>
    <script src="js/scenes/GameScene.js"></script>
    <script src="js/scenes/FriendScene.js"></script>
    <script src="js/scenes/ExerciseScene.js"></script>
    <script src="js/scenes/TrainingScene.js"></script>
    <script src="js/main.js"></script>
    <script>
    // Subtle floating particles
    (function() {
        const c = document.getElementById('particles-bg');
        if (!c) return;
        const ctx = c.getContext('2d');
        let w, h, particles = [];
        function resize() { w = c.width = window.innerWidth; h = c.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();
        for (let i = 0; i < 35; i++) {
            particles.push({
                x: Math.random() * w, y: Math.random() * h,
                r: Math.random() * 1.8 + 0.5,
                dx: (Math.random() - 0.5) * 0.3,
                dy: (Math.random() - 0.5) * 0.3,
                o: Math.random() * 0.25 + 0.05,
            });
        }
        function draw() {
            ctx.clearRect(0, 0, w, h);
            particles.forEach(p => {
                p.x += p.dx; p.y += p.dy;
                if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
                if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(160,190,255,' + p.o + ')';
                ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        draw();
    })();
    </script>
</body>
</html>
