<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schach gegen Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0e0e0;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        h1 {
            font-size: 1.6rem;
            color: #e0e0e0;
            letter-spacing: 1px;
        }
        #controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        #controls select, #controls button {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: inherit;
        }
        #controls select {
            background: #16213e;
            color: #e0e0e0;
            border: 1px solid #334;
        }
        #controls button {
            background: #0f3460;
            color: #e0e0e0;
            transition: background 0.2s;
        }
        #controls button:hover {
            background: #1a5276;
        }
        #status {
            font-size: 1.1rem;
            padding: 8px 16px;
            background: #16213e;
            border-radius: 8px;
            min-width: 300px;
            text-align: center;
        }
        #mode-switch {
            display: flex;
            gap: 8px;
            margin-bottom: 4px;
        }
        #mode-switch button {
            padding: 8px 18px;
            border: 2px solid #334;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: inherit;
            background: #16213e;
            color: #e0e0e0;
            transition: background 0.2s, border-color 0.2s;
        }
        #mode-switch button.active {
            background: #0f3460;
            border-color: #5bc85b;
            color: #fff;
        }
        #training-controls {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        #training-controls .row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        #training-controls select, #training-controls button {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: inherit;
        }
        #training-controls select {
            background: #16213e;
            color: #e0e0e0;
            border: 1px solid #334;
        }
        #training-controls button {
            background: #0f3460;
            color: #e0e0e0;
            transition: background 0.2s;
        }
        #training-controls button:hover {
            background: #1a5276;
        }
        #puzzle-title {
            font-size: 0.95rem;
            color: #c4a265;
        }
        #puzzle-hint {
            font-size: 0.9rem;
            color: #7fc97f;
            min-height: 1.2em;
            cursor: pointer;
        }
        #puzzle-progress {
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>&#9816; Schach</h1>
        <div id="mode-switch">
            <button id="btn-mode-play" class="active" onclick="switchMode('play')">⚔ Spielen</button>
            <button id="btn-mode-train" onclick="switchMode('train')">🧩 Training</button>
        </div>
        <div id="controls">
            <select id="play-as" title="Spielfarbe">
                <option value="white">Spielen als Weiß</option>
                <option value="black">Spielen als Schwarz</option>
            </select>
            <select id="difficulty" title="Schwierigkeit">
                <option value="1">Anfänger</option>
                <option value="2" selected>Mittel</option>
                <option value="3">Stark</option>
            </select>
            <button id="btn-new-game">Neues Spiel</button>
        </div>
        <div id="training-controls">
            <div class="row">
                <select id="puzzle-category"></select>
                <button id="btn-prev-puzzle">← Zurück</button>
                <button id="btn-next-puzzle">Weiter →</button>
            </div>
            <div class="row">
                <button id="btn-hint">💡 Hinweis</button>
                <button id="btn-reset-puzzle">↻ Neustart</button>
            </div>
            <div id="puzzle-title"></div>
            <div id="puzzle-hint"></div>
            <div id="puzzle-progress"></div>
        </div>
        <div id="status">Du bist am Zug</div>
        <div id="phaser-game"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/chessLogic.js"></script>
    <script src="js/chessEngine.js"></script>
    <script src="js/puzzleDatabase.js"></script>
    <script src="js/scenes/BootScene.js"></script>
    <script src="js/scenes/GameScene.js"></script>
    <script src="js/scenes/TrainingScene.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
