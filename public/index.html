<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Schach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0f0c29 0%, #1a1a3e 40%, #24243e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif;
            color: #e0e0e0;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 28px 24px 20px;
            background: rgba(16, 16, 40, 0.55);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            backdrop-filter: blur(16px);
            box-shadow: 0 12px 48px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03) inset;
        }
        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 2px 12px rgba(91,200,91,0.15);
        }

        /* --- Mode Switch Tabs --- */
        #mode-switch {
            display: flex;
            gap: 0;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            padding: 3px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        #mode-switch button {
            padding: 9px 24px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            background: transparent;
            color: #8a8aaf;
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
        }
        #mode-switch button:hover {
            color: #c0c0e0;
        }
        #mode-switch button.active {
            background: linear-gradient(135deg, #3a7bd5 0%, #5b68d4 100%);
            color: #fff;
            box-shadow: 0 3px 12px rgba(58,123,213,0.35);
        }

        /* --- Controls (Spielen) --- */
        #controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* --- Shared Selects & Buttons --- */
        select, .ctrl-btn {
            padding: 9px 16px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            background: rgba(255,255,255,0.05);
            color: #d0d0e8;
            transition: all 0.2s ease;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        select:hover, .ctrl-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.15);
        }
        select:focus {
            border-color: rgba(58,123,213,0.5);
            box-shadow: 0 0 0 3px rgba(58,123,213,0.15);
        }
        select option {
            background: #1a1a3e;
            color: #d0d0e8;
        }
        .ctrl-btn {
            background: linear-gradient(135deg, rgba(58,123,213,0.2), rgba(91,104,212,0.2));
            border-color: rgba(58,123,213,0.25);
            color: #c0d0ff;
        }
        .ctrl-btn:hover {
            background: linear-gradient(135deg, rgba(58,123,213,0.35), rgba(91,104,212,0.35));
            border-color: rgba(58,123,213,0.4);
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(58,123,213,0.2);
        }
        .ctrl-btn:active {
            transform: translateY(0);
        }
        .btn-accent {
            background: linear-gradient(135deg, #3a7bd5, #5b68d4);
            border-color: transparent;
            color: #fff;
        }
        .btn-accent:hover {
            background: linear-gradient(135deg, #4a8be5, #6b78e4);
            color: #fff;
            box-shadow: 0 4px 14px rgba(58,123,213,0.35);
        }

        /* --- Status Bar --- */
        #status {
            font-size: 0.95rem;
            font-weight: 500;
            padding: 10px 24px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            min-width: 340px;
            text-align: center;
            letter-spacing: 0.2px;
            color: #c8c8e8;
        }

        /* --- Training Controls --- */
        #training-controls {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        #training-controls .row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        #puzzle-title {
            font-size: 0.92rem;
            font-weight: 500;
            color: #d4a853;
            letter-spacing: 0.3px;
        }
        #puzzle-hint {
            font-size: 0.88rem;
            color: #7fc97f;
            min-height: 1.2em;
            cursor: pointer;
            font-weight: 500;
        }
        #puzzle-progress {
            font-size: 0.82rem;
            color: #6a6a8f;
            font-weight: 500;
        }

        /* --- Settings Row --- */
        #settings-row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        #settings-row label {
            font-size: 0.82rem;
            color: #8a8aaf;
            font-weight: 500;
        }
        #settings-row select {
            padding: 6px 12px;
            font-size: 0.82rem;
        }

        /* --- Phaser Canvas --- */
        #phaser-game {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        #phaser-game canvas {
            border-radius: 12px;
        }

        /* --- Scrollbar --- */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        /* --- Touch & iPad Optimierungen --- */
        html, body {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        #phaser-game {
            touch-action: none;
            max-width: 100%;
        }
        #phaser-game canvas {
            max-width: 100%;
        }

        /* iPad Landscape (begrenzte Höhe) */
        @media (max-height: 860px) {
            #game-container {
                padding: 14px 18px 12px;
                gap: 8px;
            }
            h1 { font-size: 1.35rem; }
            #status {
                padding: 6px 18px;
                font-size: 0.85rem;
                min-width: 280px;
            }
            #mode-switch button {
                padding: 7px 18px;
                font-size: 0.85rem;
            }
            select, .ctrl-btn {
                padding: 7px 14px;
                font-size: 0.82rem;
            }
            #settings-row select {
                padding: 5px 10px;
            }
            #puzzle-title { font-size: 0.85rem; }
        }

        /* iPad Portrait / schmaler Tablet */
        @media (max-width: 820px) {
            #game-container {
                padding: 16px 12px 12px;
                gap: 10px;
                border-radius: 14px;
                width: 95vw;
                max-width: 740px;
            }
            h1 { font-size: 1.45rem; }
            #status { min-width: auto; width: 100%; }
            #controls, #training-controls .row, #settings-row {
                width: 100%;
            }
        }

        /* Sehr begrenzter Platz (Landscape kleines iPad) */
        @media (max-height: 750px) {
            #game-container {
                padding: 8px 12px;
                gap: 6px;
            }
            h1 { font-size: 1.2rem; }
            #mode-switch button {
                padding: 6px 14px;
                font-size: 0.8rem;
            }
            #status {
                padding: 5px 14px;
                font-size: 0.8rem;
            }
            select, .ctrl-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
        }

        /* Touch target Mindestgröße */
        @media (pointer: coarse) {
            select, .ctrl-btn, #mode-switch button {
                min-height: 44px;
            }
            #controls { gap: 8px; }
            #training-controls .row { gap: 8px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>&#9816; Schach</h1>
        <div id="mode-switch">
            <button id="btn-mode-play" class="active">&#9876; Spielen</button>
            <button id="btn-mode-train">&#128218; Training</button>
        </div>
        <div id="controls">
            <select id="play-as" title="Spielfarbe">
                <option value="white">Spielen als Weiß</option>
                <option value="black">Spielen als Schwarz</option>
            </select>
            <select id="difficulty" title="Schwierigkeit">
                <option value="1">Anfänger</option>
                <option value="2" selected>Mittel</option>
                <option value="3">Stark</option>
            </select>
            <button id="btn-new-game" class="ctrl-btn btn-accent">Neues Spiel</button>
        </div>
        <div id="training-controls">
            <div class="row">
                <select id="puzzle-category"></select>
                <button id="btn-reset-puzzle" class="ctrl-btn">↻ Neustart</button>
                <button id="btn-next-puzzle" class="ctrl-btn btn-accent">Nächstes →</button>
            </div>
            <div class="row">
                <button id="btn-hint" class="ctrl-btn">💡 Hinweis</button>
                <button id="btn-prev-puzzle" style="display:none;"></button>
            </div>
            <div id="puzzle-title"></div>
            <div id="puzzle-hint"></div>
            <div id="puzzle-progress"></div>
        </div>
        <div id="settings-row">
            <label for="piece-style">Figuren:</label>
            <select id="piece-style" title="Figurenstil">
                <option value="wood">Holz</option>
                <option value="cburnett" selected>Cburnett</option>
                <option value="merida">Merida</option>
                <option value="alpha">Alpha</option>
                <option value="staunty">Staunty</option>
                <option value="california">California</option>
                <option value="maestro">Maestro</option>
                <option value="kosal">Kosal</option>
                <option value="letter">Buchstaben</option>
            </select>
        </div>
        <div id="status">Du bist am Zug</div>
        <div id="phaser-game"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/chessLogic.js"></script>
    <script src="js/chessEngine.js"></script>
    <script src="js/puzzleDatabase.js"></script>
    <script src="js/scenes/BootScene.js"></script>
    <script src="js/scenes/GameScene.js"></script>
    <script src="js/scenes/ExerciseScene.js"></script>
    <script src="js/scenes/TrainingScene.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
